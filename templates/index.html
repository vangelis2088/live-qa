<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vote for the next talk</title>
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <script>
    // Swap validation errors (422) into the list instead of discarding them.
    document.addEventListener("htmx:beforeSwap", (e) => {
      if (e.detail.xhr.status === 422) {
        e.detail.shouldSwap = true;
        e.detail.isError = false;
      }
    });
  </script>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 40rem; margin: 2rem auto; padding: 0 1rem; }
    form { display: grid; gap: .5rem; margin-bottom: 1.5rem; }
    input, button { font: inherit; padding: .4rem; }
    .badge { background: #fde68a; border-radius: .25rem; padding: 0 .4rem; font-size: .8rem; }
    li.voted { background: #ecfdf5; border-left: 3px solid #10b981; padding-left: .4rem; }
    .count { font-weight: bold; margin: 0 .4rem; }
    .error { color: #b91c1c; }
  </style>
</head>
<body>
  <h1>Vote for the next talk</h1>
  <form hx-post="/topics" hx-target="#topics" hx-swap="innerHTML" hx-on::after-request="if (event.detail.successful) this.reset()">
    <input name="title" placeholder="Suggest a topic" maxlength="280" required>
    <input name="author" placeholder="Your name (optional)">
    <button type="submit">Suggest</button>
  </form>
  <div id="topics" hx-get="/topics" hx-trigger="every 3s" hx-swap="innerHTML">
    {% include "_topics.html" %}
  </div>
</body>
</html>
